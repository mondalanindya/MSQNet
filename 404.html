<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to MSQNet...</title>
  <script>
    // GitHub Pages SPA / Case-insensitivity redirect
    (function() {
      var currentPath = window.location.pathname;
      // If path contains msqnet with any casing, redirect to /MSQNet/
      if (currentPath.toLowerCase().indexOf('/msqnet') !== -1) {
        window.location.replace('/MSQNet/');
      } else {
        window.location.replace('/MSQNet/');
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 4rem 1rem;
      background: #0b0f17;
      color: #f1f5f9;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: white;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Redirecting to MSQNet...</h1>
  <p>If you are not redirected automatically within 3 seconds, please click below:</p>
  <a href="/MSQNet/" class="btn">Go to MSQNet Project Page</a>
</body>
</html>
